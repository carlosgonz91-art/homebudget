name: Weekly mortgage rates
on:
  schedule:
    - cron: '17 19 * * 4'   # Thursday afternoon, after Freddie Mac publishes
    - cron: '17 14 * * 5'   # Friday retry
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_rates.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain rates.json)" ]; then
            git config user.name "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git add rates.json
            git commit -m "Weekly mortgage rates"
            git push
          fi
