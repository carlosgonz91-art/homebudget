:root{--bg:#f3f4fa;--card:#fff;--ink:#151a2d;--mute:#5f667c;--line:#e9ebf3;--brand:#4f46e5;--brandink:#fff;--g1:#4f46e5;--g2:#7c3aed;--good:#047857;--warnic:#b45309;--bad:#d01040;--tp:#6ee7b7;--tn:#fda4af;--warn:#b45309;--track:#eceef7;--fill:#6d6cf0;--soft:#f6f7fc;--scrim:rgba(12,14,30,.45);--sh:0 1px 2px rgba(20,24,60,.05),0 10px 28px -14px rgba(20,24,60,.16);--glass:rgba(255,255,255,.78)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#090c16;--card:#121726;--ink:#eceffa;--mute:#8f98b3;--line:#222942;--brand:#8b8cff;--brandink:#0a0d17;--g1:#5046e5;--g2:#7c3aed;--good:#34d399;--tp:#047857;--tn:#be123c;--bad:#fb7185;--warn:#fbbf24;--warnic:#fbbf24;--track:#1e2540;--fill:#7778f0;--soft:#171d30;--scrim:rgba(2,4,12,.66);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -14px rgba(0,0,0,.6);--glass:rgba(18,23,38,.78);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090c16;--card:#121726;--ink:#eceffa;--mute:#8f98b3;--line:#222942;--brand:#8b8cff;--brandink:#0a0d17;--g1:#5046e5;--g2:#7c3aed;--good:#34d399;--tp:#047857;--tn:#be123c;--bad:#fb7185;--warn:#fbbf24;--warnic:#fbbf24;--track:#1e2540;--fill:#7778f0;--soft:#171d30;--scrim:rgba(2,4,12,.66);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -14px rgba(0,0,0,.6);--glass:rgba(18,23,38,.78);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line)}
header::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}

.ver{font-size:10.5px;font-weight:600;color:var(--mute);background:var(--track);padding:2px 7px;border-radius:99px;letter-spacing:0}
.tbtn{margin-left:auto;border:0;background:var(--track);color:var(--mute);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:.15s}

.tbtn:hover{color:var(--brand)}

.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:650;font-size:14px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(20,24,60,.16),0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent)}
.gear{margin-left:8px;border:0;background:var(--track);color:var(--mute);width:38px;height:38px;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;transition:.15s}
.gear.on{color:var(--brandink);background:var(--brand)}
nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--glass);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 14px 40px -12px rgba(15,18,50,.35)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mute);font:inherit;font-size:10.5px;font-weight:650;padding:8px 2px 7px;border-radius:18px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
nav button.on svg{transform:translateY(-1px) scale(1.06)}
nav button[hidden]{display:none}
main{max-width:980px;margin:0 auto;padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;animation:vin .28s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important}}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:2px 0 12px}h2{font-size:17px;font-weight:750;letter-spacing:-.015em;margin:0 0 12px}h3{font-size:15px;font-weight:700;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.mute{color:var(--mute)}.sub{color:var(--mute);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crh{flex-wrap:wrap;gap:2px 10px}
.spacer{flex:1}
/* overview hero */
.stats{display:block;margin-bottom:16px}
.hx::before,.hx::after{display:none}
.hx{padding:22px 22px 16px}
.hxh{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hxm{min-width:0}
.hxl{font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hxn{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hxp{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12px;font-weight:700}
.hxp.warn{background:rgba(255,209,102,.3)}
.hxg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1 1 420px;max-width:560px}
.hxg:has(>.hxt:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
.hxt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0;transition:background .15s}
.hxt:hover{background:rgba(255,255,255,.2)}.hxt:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hxt span{display:block;font-size:12px;font-weight:600;opacity:.85}
.hxt b{display:block;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;margin:1px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hxt em{display:block;font-style:normal;font-size:11.5px;font-weight:650;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hxt em.ok{color:#5dffb4}.hxt em.bad{color:#ff8fab}
.hxc{margin-top:16px;outline:none}.hxc:focus-visible{box-shadow:0 0 0 2px #fff;border-radius:10px}
.hxcl{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;font-weight:600;opacity:.9;margin-bottom:6px}
.hxcl i{display:inline-block;width:16px;margin-right:6px;vertical-align:middle;border-top:3px solid #2ff5c8}
.hxcl i.s2{border-top:2.5px dashed #ffc233}.hxcl i.s3{border-top:2.5px dotted #2ff5c8}.hxcl i.s4{border-top:2.5px dashed #ff4f8b}
.hxcw{position:relative;height:150px;cursor:crosshair;touch-action:pan-y}
.hxcw svg{width:100%;height:100%;display:block;overflow:visible}
.hxy span{position:absolute;left:0;transform:translateY(-110%);font-size:10.5px;font-weight:600;opacity:.65}
.hxd,.hxq,.hxq2{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#2ff5c8;box-shadow:0 0 0 4px rgba(47,245,200,.3),0 0 0 6px rgba(255,255,255,.15);pointer-events:none}
.hxq2{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#ffc233;box-shadow:0 0 0 3px rgba(255,194,51,.3)}
.hxv{position:absolute;top:0;bottom:0;border-left:1.5px dashed rgba(255,255,255,.7);pointer-events:none}
.hxtt{position:absolute;top:4px;background:#fff;color:#1e1b4b;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35;box-shadow:0 10px 26px rgba(0,0,0,.25);pointer-events:none;z-index:3;display:flex;flex-direction:column;white-space:nowrap}
.hxtt span{color:#6b7280;font-weight:600}.hxtt b{font-size:14px}.hxtt em{font-style:normal;color:#4b5563}.hxtt i{font-style:normal;font-weight:700}.hxtt i.bad{color:#dc2626}.hxtt i.ok{color:#059669}
.hxx{display:flex;justify-content:space-between;font-size:11px;font-weight:600;opacity:.7;margin-top:6px}
@media (max-width:640px){.hxn{font-size:42px}.hxg{grid-template-columns:repeat(3,minmax(0,1fr));flex-basis:100%;max-width:none}.hxt{padding:8px 9px}.hxt b{font-size:16px}.hxt em{font-size:10.5px}.hxcw{height:120px}}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 18px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 18px 40px -18px color-mix(in srgb,var(--g1) 70%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.hero::before{width:240px;height:240px;right:-70px;top:-110px}
.hero::after{width:150px;height:150px;right:60px;bottom:-90px;background:rgba(255,255,255,.07)}
.hl{font-size:13px;font-weight:600;opacity:.95;letter-spacing:.01em;position:relative}
.hn{font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:4px 0 16px;font-variant-numeric:tabular-nums;position:relative}
.hrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;position:relative}
.hchip.hgo{cursor:pointer;transition:background .15s,transform .1s}.hchip.hgo:hover{background:rgba(255,255,255,.24)}.hchip.hgo:active{transform:scale(.98)}.hchip.hgo:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fxrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bkw>.row{flex-wrap:nowrap}.bkt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.bkt h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bkt .bkh{display:flex;align-items:center;gap:6px}.bkw .bkh{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcr.go{cursor:pointer;border-radius:12px;transition:background .12s}.rcr.go:hover{background:var(--soft)}.rcmore{margin-top:8px;width:100%}
.tkre.spin svg{animation:tkspin .8s linear infinite}@keyframes tkspin{to{transform:rotate(360deg)}}.tkre.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}.tkre.done svg{animation:tkpop .5s ease}@keyframes tkpop{40%{transform:scale(1.25)}}@media (prefers-reduced-motion:reduce){.tkre.spin svg,.tkre.done svg{animation:none}}
.sfbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sfbtns>*{flex:none}.okg{color:var(--good);font-weight:600}.sfbtns .sfdc{color:var(--bad)!important}
.dgroup{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.drow{border-top:1px solid var(--line)}.drow:first-child{border-top:0}
.drow>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700}.drow>summary::-webkit-details-marker{display:none}
.drow>summary>span{flex:1;min-width:0;display:flex;flex-direction:column}.drow>summary small{font-weight:500;color:var(--mute);font-size:12px}
.drow>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:4px}.drow[open]>summary::after{transform:rotate(45deg)}

function detectDelim(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,8);
  const score=d=>lines.reduce((a,l)=>a+(l.split(d).length-1),0);
  const c=score(','),s=score(';'),t=score('\t');
  if(t>c&&t>=s) return '\t';
  if(s>c) return ';';
  return ',';
}

  const pm=(full||text).match(new RegExp('('+MONW+') (\\d{1,2}), (\\d{4}) through ('+MONW+') (\\d{1,2}), (\\d{4})'));
  if(!pm) return null;
  const start=iso(+pm[3],monNum(pm[1]),+pm[2]),end=iso(+pm[6],monNum(pm[4]),+pm[5]);
  const acct=(text.match(/Account Number:\s*(\d{6,})/)||[])[1]||'';
  const savings=/SAVINGS SUMMARY/i.test(text)&&!/CHECKING SUMMARY/i.test(text);
  const hd=full?lines.find(l=>/^CHASE [A-Z ]*(CHECKING|SAVINGS)$/.test(l)):null;
  const prod=hd?titleCase(hd.toLowerCase()):(text.match(/Chase (?:[A-Z][a-z]+ )?(?:Checking|Savings)/)||[])[0]||('Chase '+(savings?'Savings':'Checking'));
  const res=mkRes({issuer:'Chase',name:prod,type:savings?'savings':'checking',last4:acct.slice(-4),start,end});
  let inD=false;
  for(const l of lines){
    if(/^TRANSACTION DETAIL/i.test(l)){inD=true;continue;}
    if(!inD) continue;
    if(/^Ending Balance/i.test(l)) break;
    const m=l.match(/^(\d\d)\/(\d\d)\s+(.*)$/);if(!m) continue;
    // a long check/trace number printed after the balance is not an amount
    const {head,amts}=trailAmts(m[3].replace(/\s+\d{12,}$/,''));if(!amts.length) continue;
    const amount=amts.length>=2?amts[amts.length-2]:amts[0];
    const date=resolveDate(+m[1],+m[2],end);if(!date) continue;
    res.txns.push({date,desc:head.replace(/^\d\d\/\d\d\s+/,'')||'(no description)',amount});
  }
  const b=money(text,'Beginning Balance'),e=money(text,'Ending Balance');
  if(b!=null&&e!=null){res.reconcile=rec(e-b,sumAmts(res.txns));res.beginBal=b;res.endBal=e;}
  return finish(res);
}
function parseChaseCard(lines,text){

  if(!pm) return null;

  const last4=(text.match(/Account Number:\s*X{4}\s+X{4}\s+X{4}\s+(\d{4})/)||[])[1]||'';

  if(p!=null&&n!=null){res.reconcile=rec(n-p,-sumAmts(res.txns));res.beginBal=-p;res.endBal=-n;}
  return finish(res);
}
function parseDiscoverSavings(lines,text){
  const pm=text.match(new RegExp('Statement Period:\\s*('+MONW+')\\s+(\\d{1,2}),\\s*(\\d{4})\\s*-\\s*('+MONW+')\\s+(\\d{1,2}),\\s*(\\d{4})'));
  if(!pm) return null;
  const start=iso(+pm[3],monNum(pm[1]),+pm[2]),end=iso(+pm[6],monNum(pm[4]),+pm[5]);
  const acct=(text.match(/Account Number:\s*(\d{4,})/)||[])[1]||'';
  const res=mkRes({issuer:'Discover',name:/ONLINE SAVINGS/i.test(text)?'Discover Online Savings':'Discover Savings',type:'savings',last4:acct.slice(-4),start,end});
  const rx=new RegExp('^('+MONW+') (\\d{1,2}) ('+MONW+') (\\d{1,2}) (.*)$');

      if(/^Deposits and Credits$/i.test(l)) sign=1;

    const date=resolveDate(monNum(m[3]),+m[4],end);if(!date) continue;
    res.txns.push({date,desc:head||'(no description)',amount:sign*Math.abs(amts[amts.length-1])});

  if(b!=null&&e!=null){res.reconcile=rec(e-b,sumAmts(res.txns));res.beginBal=b;res.endBal=e;}
  return finish(res);
}
function parseMarcus(lines,text){
  const pm=text.match(/(\d\d)\/(\d\d)\/(\d{4}) to (\d\d)\/(\d\d)\/(\d{4})/);
  if(!pm) return null;
  const start=iso(+pm[3],+pm[1],+pm[2]),end=iso(+pm[6],+pm[4],+pm[5]);
  const acct=(text.match(/Account Number\s+(\d{6,})/)||[])[1]||'';
  const nm=(lines.map(l=>l.match(/^Account Name (.+)$/)).find(Boolean)||[])[1];
  const res=mkRes({issuer:'Marcus',name:'Marcus '+(nm?nm.trim():'Savings'),type:'savings',last4:acct.slice(-4),start,end});
  let inA=false,prev=null;
  for(const l of lines){
    if(/^ACCOUNT ACTIVITY/i.test(l)){inA=true;continue;}
    if(!inA) continue;

    const {head,amts}=trailAmts(m[4]);if(!amts.length) continue;
    if(/^Beginning Balance/i.test(head)){prev=amts[amts.length-1];continue;}
    if(/^Ending Balance/i.test(head)) continue;

    let amt,sign;

  if(b!=null&&e!=null){res.reconcile=rec(e-b,sumAmts(res.txns));res.beginBal=b;res.endBal=e;}
  return finish(res);
}
// A Fidelity report can hold several accounts (for example a Cash Management account and an IRA). Every page of an
// account starts with "Account # ...", so the pages are grouped by that number and each account is read on its own.
// Before, all rows went to one account and the totals could not match.
function parseFidelityAll(lines,text){
  const order=[],by={};let cur=null;
  for(const l of lines){const m=l.match(/^Account # ([\w-]{6,})\s*$/);if(m){cur=m[1];if(!by[cur]){by[cur]=[];order.push(cur);}continue;}if(cur) by[cur].push(l);}
  if(order.length<2){const one=parseFidelity(lines,text);return one?[one]:null;}
  const out=order.map(a=>parseFidelity(by[a],text,a)).filter(Boolean);
  return out.length?out:null;
}
function parseFidelity(lines,text,acct0){
  const pm=text.match(new RegExp('INVESTMENT REPORT\\s+('+MONW+') (\\d{1,2}), (\\d{4}) - ('+MONW+') (\\d{1,2}), (\\d{4})'));
  if(!pm) return null;
  const start=iso(+pm[3],monNum(pm[1]),+pm[2]),end=iso(+pm[6],monNum(pm[4]),+pm[5]);
  const acct=acct0||(text.match(/Account (?:Number:|#)\s*([\w-]{6,})/)||[])[1]||'';

  const own=acct0?(text.split('\n').find(l=>l.includes(acct0)&&/FIDELITY/.test(l))||''):text;
  const pt=(own.match(/FIDELITY®?\s+((?:TRADITIONAL |ROTH |ROLLOVER |SEP |SIMPLE )?IRA|INDIVIDUAL|JOINT[A-Z ]*|BROKERAGE|HEALTH SAVINGS|HSA|CASH MANAGEMENT)/)||[])[1];
  const nice=pt?pt.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\bIra\b/,'IRA').replace(/\bHsa\b/,'HSA'):'Account';
  const res=mkRes({issuer:'Fidelity',name:'Fidelity '+nice,type:'brokerage',last4:acct.replace(/\D/g,'').slice(-4),start,end});
  let sec=false,last=null,printed=null,cf=0,cfr=null;const rows=[],flows=[];
  for(let l of lines){
    l=l.replace(/\s+[A-Z]{2}_[A-Z]{2} _\S+(?: \d{8})?$/,''); // page footer code that sometimes lands on the end of a row
    // money moving in or out of the account (deposits, contributions, withdrawals, distributions): their own sections
    {const h=l.match(/^(Deposits|Contributions|Exchanges In|Withdrawals|Distributions|Exchanges Out)$/);if(h){cf=/^(Deposits|Contributions|Exchanges In)$/.test(h[1])?1:-1;cfr=null;sec=false;continue;}}
    if(cf){
      const tt=l.match(/^Total (?:Deposits|Contributions|Exchanges In|Withdrawals|Distributions|Exchanges Out)\s+(-?\$?-?[\d,]*\.\d\d)/);
      if(tt){printed=(printed||0)+cf*Math.abs(parseAmount(tt[1].replace('$','')));cf=0;continue;}
      if(/^(Core Fund Activity|Securities |Dividends, Interest|Other Activity|Holdings|Account Summary)/.test(l)){cf=0;}
      else{const m=l.match(/^(\d\d)\/(\d\d)\s+(.*?)\s+-?\$?(-?[\d,]*\.\d\d)$/);
        if(m){cfr={mm:+m[1],dd:+m[2],name:m[3],amount:cf*Math.abs(parseAmount(m[4]))};flows.push(cfr);continue;}
        if(cfr&&/\*{3,}\d{4}|bank|n\.?a\.?/i.test(l)&&!/^(Date|Total)/.test(l)){cfr.name+=' '+l;cfr=null;}
        continue;}
    }
    if(/^Dividends, Interest & Other Income/.test(l)){sec=true;last=null;continue;}
    if(/^Other Activity In or Out\s*$/.test(l)){sec=true;last=null;res.warnings.push('"Other Activity" rows (contributions, transfers) were read best-effort — please check them.');continue;}
    if(!sec) continue;
    if(/^Core Fund Activity|^Securities (Bought|Sold)/.test(l)){sec=false;continue;}
    const tm=l.match(/^Total (?:Dividends, Interest & Other Income|Other Activity In or Out)\s+\$?\s*(-?[\d,]*\.\d\d)/);
    if(tm){if(/Dividends/.test(l)) printed=(printed||0)+parseAmount(tm[1]);sec=false;continue;}
    const m=l.match(/^(\d\d)\/(\d\d)\s+(.*)$/);
    if(!m){
      if(last&&!/^(Settlement|Date |\(Includes|Total|Security|For more)/.test(l)&&/^[A-Z0-9 &.'\/-]+$/.test(l)) last.name+=' '+l;
      continue;
    }
    const toks=m[3].split(' ');const amt=parseAmount(toks.pop());if(isNaN(amt)) continue;
    for(let k=0;k<2;k++) if(toks.length&&/^(-|[\d,]*\.?\d+)$/.test(toks[toks.length-1])) toks.pop();
    let ci=-1;for(let i=toks.length-1;i>=0;i--) if(/^(?=.*\d)[0-9A-Z]{9}$/.test(toks[i])){ci=i;break;}

    rows.push(row);last=row;
  }

    if(/^Reinvestment$/i.test(r.typ)) continue;
    const date=resolveDate(r.mm,r.dd,end);if(!date) continue;
    res.txns.push({date,desc:(r.typ+': '+r.name).replace(/\s+/g,' ').trim(),amount:r.amount});
  }

  if(printed!=null) res.reconcile=rec(printed,rows.reduce((a,r)=>a+r.amount,0)+flows.reduce((a,r)=>a+r.amount,0));

  {const own=lines.join('\n'),vb=money(own,'Beginning Account Value'),ve=money(own,'Ending Account Value(?: \\*\\*)?');if(vb!=null)res.valBegin=vb;if(ve!=null)res.valEnd=ve;}
  return finish(res);
}

// Mortgage statement (First United / LoanSphere layout). Only the principal part of each row changes what you owe, so that

  const pm=text.match(/Transaction Activity \((\d\d)\/(\d\d)\/(\d\d) to (\d\d)\/(\d\d)\/(\d\d)\)/);if(!pm) return null;
  const start=iso(2000+ +pm[3],+pm[1],+pm[2]),end=iso(2000+ +pm[6],+pm[4],+pm[5]);if(!end) return null;
  const last4=((text.match(/Loan Number\s+(\d{6,})/)||[])[1]||'').slice(-4);
  const res=mkRes({issuer:/First United/i.test(text)||/firstunitedbank/i.test(text)?'First United':'Mortgage',name:'Mortgage',type:'loan',last4,start,end});
  res.name=(res.issuer==='Mortgage'?'':res.issuer+' ')+'Mortgage';
  let inA=false,sum=0;
  for(const l of lines){
    if(/^Transaction Activity \(/.test(l)){inA=true;continue;}
    if(/^Past Payments Breakdown/.test(l)){inA=false;continue;}
    if(!inA) continue;
    const m=l.match(/^(\d\d)\/(\d\d)\/(\d\d)\s+(.*)$/);if(!m) continue;
    const {head,amts}=trailAmts(m[4]);if(amts.length<7) continue; // Principal, Interest, Escrow, Late, Other, Advance, Total
    const pr=amts[amts.length-7];if(Math.abs(pr)<0.005) continue;
    const date=iso(2000+ +m[3],+m[1],+m[2]);if(!date) continue;

  // the payment itself, from "Explanation of Amount Due": regular payment minus escrow is principal + interest.
  // Extra principal is what this statement shows as a curtailment/reduction row.

  res.loanNote=true;
  return finish(res);
}
function parseGeneric(lines,text){

  const valid=dts.filter(Boolean).sort();if(!valid.length) return null;

  res.warnings.push('Unrecognized bank format — best guess. Check dates, signs and amounts before importing.');
  return res;
}
// The yield a bank prints on a deposit statement ("Annual Percentage Yield Earned"). Value is on the label line or on a line just below it.

    }
  }

}

  const num=v=>v==null||v===''?null:(isFinite(+v)?+v:null);

  for(const k of Object.keys(st.balSf)){const b=st.balSf[k];if(!isO(b)) delete st.balSf[k];else b.v=num(b.v);}
  st.files=st.files.filter(isO);
  for(const k of Object.keys(st.holdings)) st.holdings[k].forEach(x=>{for(const f of ['shares','price','basis']) if(f in x) x[f]=num(x[f]);});
  for(const k of Object.keys(st.budgets)){const b=st.budgets[k];if(isO(b)){for(const kk of Object.keys(b)){const v=num(b[kk]);if(v==null||BADK(kk)) delete b[kk];else b[kk]=v;}}else{const v=num(b);if(v==null) delete st.budgets[k];else st.budgets[k]=v;}}

  return dropped;
}

// every dialog: focus moves in, Tab stays inside, Escape or a click on the dim background closes, focus returns afterwards
(function(){
  const d=document.getElementById('dlg');let opener=null,was=false,downOn=false;
  const FOC='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
  const list=()=>[...d.querySelectorAll(FOC)].filter(e=>!e.closest('[hidden]'));
  const closeDlg=()=>{const n=d.querySelector('#dlgNo,[data-act=bdclose]');if(n)n.click();else{d.classList.remove('show');d.innerHTML='';}};
  const sync=()=>{
    const box=d.querySelector('.dlgbox'),on=d.classList.contains('show')&&!!box;
    if(on&&!was){
      was=true;const a=d._op||document.activeElement;d._op=null;
      opener=a&&a!==document.body&&!d.contains(a)?{el:a,act:a.dataset&&a.dataset.act,id:a.dataset&&a.dataset.id}:null;
    }
    if(on){
      if(!box.hasAttribute('aria-labelledby')&&!box.hasAttribute('aria-label')){const h=box.querySelector('h3,p');if(h){h.id='dlgTitle';box.setAttribute('aria-labelledby','dlgTitle');}}
      box.setAttribute('tabindex','-1');
      if(!d.contains(document.activeElement)){const f=list();(f.find(x=>x.matches('input,select,textarea'))||f[0]||box).focus({preventScroll:true});}
    }else if(!on&&was){
      was=false;const o=opener;opener=null;if(!o) return;
      let el=o.el;
      if(!el.isConnected&&o.act) el=document.querySelector('[data-act="'+o.act+'"]'+(o.id?'[data-id="'+CSS.escape(o.id)+'"]':''));
      setTimeout(()=>{let e2=el&&el.isConnected?el:(o.act?document.querySelector('[data-act="'+o.act+'"]'+(o.id?'[data-id="'+CSS.escape(o.id)+'"]':'')):null);if(!e2&&o.act==='audok') e2=document.querySelector('.fnd [data-act]')||document.querySelector('#app h2');try{if(e2&&e2.isConnected)e2.focus({preventScroll:true});}catch(x){}},0);
    }
  };
  new MutationObserver(sync).observe(d,{attributes:true,attributeFilter:['class'],childList:true});
  document.addEventListener('keydown',e=>{
    if(!d.classList.contains('show')||!d.firstElementChild) return;
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeDlg();return;}
    if(e.key==='Tab'){
      const f=list();if(!f.length){e.preventDefault();return;}
      const first=f[0],last=f[f.length-1],a=document.activeElement;
      if(!d.contains(a)){e.preventDefault();first.focus();}

      else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}
    }
  },true);
  d.addEventListener('mousedown',e=>{downOn=e.target===d;});
  d.addEventListener('click',e=>{if(e.target===d&&downOn){downOn=false;closeDlg();}});
})();

function stmtPoints(acctId){
  const P=[],ids=Array.isArray(acctId)?acctId:[acctId];
  (S.files||[]).forEach(f=>{if(!ids.includes(f.acct)||!f.start||!f.end) return;const b=f.vb!=null?f.vb:f.beginBal,e=f.ve!=null?f.ve:f.endBal;
    if(b!=null&&isFinite(b)) P.push([f.start,+b]);if(e!=null&&isFinite(e)) P.push([f.end,+e]);
    // bank and card statements: walk the transactions day by day, so money moving between accounts shows on the day it moved
    // (only when the rows add up to the printed balances; investment statements change with the market, so they keep their two points)
    // if the rows don't fully add up (e.g. savings vaults), the walk still shows big moves on their day and the printed end balance settles the rest

// drag to reorder widgets (mouse and touch)
{let D=null,raf=0;
  const place=()=>{
    const w=D.w,par=w.parentNode;
    w.style.transform='none';
    for(const t of par.children){
      if(t===w) continue;
      const r=t.getBoundingClientRect();
      if(D.x<r.left||D.x>r.right||D.y<r.top||D.y>r.bottom) continue;
      const dr=w.getBoundingClientRect(),sameRow=Math.abs((r.top+r.height/2)-(dr.top+dr.height/2))<Math.min(r.height,dr.height)*0.5;
      const before=sameRow?D.x<r.left+r.width/2:D.y<r.top+r.height/2;
      par.insertBefore(w,before?t:t.nextSibling);break;
    }
    const r=w.getBoundingClientRect();
    w.style.transform='translate('+(D.x-D.gx-r.left)+'px,'+(D.y-D.gy-r.top)+'px)';
  };
  const move=e=>{if(!D||e.pointerId!==D.pid) return;D.x=e.clientX;D.y=e.clientY;place();};
  // keep the page moving with the finger: near the top or bottom edge it scrolls (faster the closer you get) and the card stays under your finger
  const scroll=()=>{
    if(!D) return;
    const h=innerHeight,z=Math.max(130,h*.22);let v=0;
    if(D.y<z) v=-Math.max(5,Math.ceil(22*Math.min(1,(z-D.y)/z)));
    else if(D.y>h-z) v=Math.max(5,Math.ceil(22*Math.min(1,(D.y-(h-z))/z)));
    if(v){const b=scrollY;scrollBy({top:v,behavior:'instant'});if(scrollY!==b) place();}
    raf=requestAnimationFrame(scroll);
  };
  document.addEventListener('pointerdown',e=>{
    let hd=e.target.closest&&e.target.closest('.wh');if(!hd&&e.pointerType!=='touch'&&!(e.target.closest&&e.target.closest('.wx'))){const ww=e.target.closest&&e.target.closest('.editing .w');if(ww) hd=ww;}
    if(!hd||(e.pointerType==='mouse'&&e.button!==0)) return;
    e.preventDefault();const w=hd.closest('.w')||hd,r=w.getBoundingClientRect();
    D={w,pid:e.pointerId,gx:e.clientX-r.left,gy:e.clientY-r.top,x:e.clientX,y:e.clientY,hd};
    w.classList.add('dragging');try{hd.setPointerCapture(e.pointerId);}catch(_){}
    place();raf=requestAnimationFrame(scroll);
  });
  document.addEventListener('pointermove',move);
  const end=e=>{
    if(!D||e.pointerId!==D.pid) return;
    cancelAnimationFrame(raf);const w=D.w;w.style.transform='';w.classList.remove('dragging');
    const st=wState(),vis=[...w.parentNode.children].map(c=>c.dataset.w);
    st.order=vis.concat(st.order.filter(i=>!vis.includes(i)));wSave(st);D=null;
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('keydown',e=>{
    const hd=e.target.closest&&e.target.closest('.wh');if(!hd||(e.key!=='ArrowUp'&&e.key!=='ArrowDown')) return;
    e.preventDefault();const id=hd.dataset.wh,st=wState(),vis=[...document.querySelectorAll('.wgrid>.w')].map(c=>c.dataset.w),i=vis.indexOf(id),j=i+(e.key==='ArrowUp'?-1:1);
    if(j<0||j>=vis.length) return;[vis[i],vis[j]]=[vis[j],vis[i]];st.order=vis.concat(st.order.filter(x=>!vis.includes(x)));wSave(st);render();
    const n=document.querySelector('.wh[data-wh="'+id+'"]');if(n) n.focus();
  });
}

function syncWhen(ms){
  const d=new Date(ms),tm=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),t0=new Date();t0.setHours(0,0,0,0);

}

function rolloverIn(cat,ym){

// statements saved by older versions have no start/end balance: read the kept PDF again and fill them in, once
async function backfillStmtBal(){
  const L=(S.files||[]).filter(f=>f.kind==='pdf'&&!f.bf&&f.vb==null&&f.ve==null&&f.endBal==null);if(!L.length) return;
  let n=0;
  for(const f of L){
    f.bf=1;const b=await blobGet(f.blob||f.id);if(!b) continue;
    try{const all=parseStatementAll(await readPdfPages(b)),r=all.find(x=>f.ref&&x.ref===f.ref)||(all.length===1?all[0]:null);if(!r) continue;
      const sg=f.flip?-1:1;if(r.valBegin!=null)f.vb=r.valBegin;if(r.valEnd!=null)f.ve=r.valEnd;if(r.beginBal!=null)f.beginBal=sg*r.beginBal;if(r.endBal!=null)f.endBal=sg*r.endBal;if(!f.start&&r.start)f.start=r.start;if(!f.end&&r.end)f.end=r.end;n++;}catch(e){}
  }
  save();if(n){dlog('import','Filled in balances from kept statements',{files:n});render();}
}
async function recheckOriginals(){
  const R=UI.recheck={busy:true,progress:'Starting…',findings:[],at:null},fl=S.files.slice(),bad=[],miss=[],drift=[];let okN=0;
  const upd=()=>{if(UI.tab==='audit') render();};upd();
  for(let i=0;i<fl.length;i++){
    const f=fl[i];R.progress='Re-reading '+(i+1)+' of '+fl.length+'…';upd();
    const nm=acctName(f.acct)+' · '+f.name,b=await blobGet(f.blob||f.id);
    if(!b){miss.push(nm);continue;}
    if(f.hash&&f.hash[0]!=='x'&&await sha256(b)!==f.hash){bad.push(nm+': the stored file changed after it was saved');continue;}
    try{
      let txns;
      if(f.kind==='pdf'){const all=parseStatementAll(await readPdfPages(b)),res=all.find(r=>f.ref&&r.ref===f.ref)||(all.length===1?all[0]:null);if(!res) throw new Error('unreadable');txns=res.txns.map(t=>({date:t.date,desc:t.desc,amount:f.flip?-t.amount:t.amount}));}
      else{
        const text=await b.text();
        if(f.kind==='ofx') txns=parseOFX(text).map(t=>Object.assign({},t,{amount:f.flip?-t.amount:t.amount}));
        else{const rows=parseCSV(text,detectDelim(text)),hi=findHeader(rows);txns=extractTxns(rows,hi,f.map,!!f.flip).txns;}
      }
      const L=new Map(S.txns.filter(t=>t.acct===f.acct).map(t=>[t.key,t])),{fresh}=assignKeys(f.acct,txns,new Set()),K=new Set(fresh.map(t=>t.key));
      let missing=fresh.filter(t=>!L.has(t.key)),extra=S.txns.filter(t=>t.src===f.id&&!K.has(t.key));const changed=fresh.filter(t=>{const r=L.get(t.key);return r&&(Math.abs(r.amount-t.amount)>0.004||r.date!==t.date);});
      // A bank-synced row stands in for the statement row when both describe the same payment, but the bank often words it
      // differently or dates it a few days apart. Pair those up (same amount, within 5 days) so they are not reported as a mismatch.
      if(missing.length){const pool=S.txns.filter(t=>t.acct===f.acct&&!K.has(t.key)),used=new Set();
        missing=missing.filter(m=>{const md=dayNum(m.date);let best=null,bd=6;for(const x of pool){if(used.has(x)||Math.abs(x.amount-m.amount)>0.004) continue;const dd=Math.abs(dayNum(x.date)-md);if(dd<bd||(dd===bd&&x.src===f.id)){best=x;bd=dd;}}if(best){used.add(best);return false;}return true;});
        extra=extra.filter(x=>!used.has(x));}
      if(missing.length||extra.length||changed.length) drift.push(nm+': '+missing.length+' in the file but not in your ledger, '+extra.length+' in your ledger but not in the file'+(changed.length?', '+changed.length+' with a different amount or date':''),...changed.slice(0,4).map(t=>{const r=L.get(t.key);return '  changed: file says '+t.date+' '+fmt(t.amount)+', ledger has '+r.date+' '+fmt(r.amount)+' · '+t.desc;}),...missing.slice(0,4).map(t=>'  missing: '+t.date+' '+fmt(t.amount)+' '+t.desc),...extra.slice(0,4).map(t=>'  extra: '+t.date+' '+fmt(t.amount)+' '+t.desc));
      else okN++;
    }catch(e){drift.push(nm+': could not be re-read');}
  }
  if(miss.length) R.findings.push({lvl:'bad',title:miss.length+' original'+(miss.length>1?'s are':' is')+' missing from browser storage',items:miss});
  if(bad.length) R.findings.push({lvl:'bad',title:'Stored file changed',items:bad});
  if(drift.length) R.findings.push({lvl:'bad',title:'Ledger and original disagree',items:drift});
  if(okN) R.findings.push({lvl:'ok',title:okN+' of '+fl.length+' originals re-read and match your ledger',items:[]});
  R.busy=false;R.at=Date.now();upd();
}

// Which account a CSV/OFX file belongs to: the account number inside the file, the last 4 digits in its name,
// the bank's name when you have one account there, or the account this kind of file went into last time.
function detectFileAcct(name,text,rows,hi,sig){
  const L=S.accounts.filter(a=>acctL4(a)),by4=d=>{const m=L.filter(a=>acctL4(a)===d);return m.length===1?m[0]:null;};
  const ofx=String(text).match(/<ACCTID>\s*([^<\s]+)/i);
  if(ofx){const a=by4(ofx[1].replace(/\D/g,'').slice(-4));if(a) return {id:a.id,why:'account number in the file'};}
  if(rows&&hi>=0){const H=rows[hi].map(x=>String(x).toLowerCase()),ci=H.findIndex(h=>/account( number| #|$)|acct/.test(h));
    if(ci>=0){const v=new Set(rows.slice(hi+1).map(r=>String(r[ci]||'').replace(/\D/g,'').slice(-4)).filter(x=>x.length===4));if(v.size===1){const a=by4([...v][0]);if(a) return {id:a.id,why:'account column in the file'};}}}
  {const n=acctFromName(name);if(n&&n.existing&&S.accounts.some(a=>a.id===n.existing)) return {id:n.existing,why:'file name'};}
  for(const d of (String(name).match(/\d{4,}/g)||[])){const a=by4(d.slice(-4));if(a) return {id:a.id,why:'last 4 digits in the file name'};}
  const nm=normMatch(name),bank=S.accounts.filter(a=>{const b=normMatch((a.ref||'').split(':')[0]||a.name.split(' ')[0]||'');return b.length>=3&&nm.includes(b);});
  if(bank.length===1) return {id:bank[0].id,why:'bank name in the file name'};
  const last=sig&&S.mappings[sig]&&S.mappings[sig].acct;if(last&&S.accounts.some(a=>a.id===last)) return {id:last,why:'this kind of file went here last time'};
  return null;
}

function recomputeImport(){

// A rule can also carry a subcategory and an income-source name; new rows pick those up on import.
function xtra(desc){const nm=normMatch(desc);for(const r of S.rules) if(nm.includes(r.match)){const o={};if(r.sub)o.sub=r.sub;if(r.inc)o.inc=r.inc;return o;}return {};}
const titleCase=x=>String(x).replace(/\b([a-z])/g,m=>m.toUpperCase());
const incomeSource=t=>t.inc||titleCase(merchantKey(t.desc))||'Other income';
const groupLabel=t=>t.cat==='Investing'?'Investing':(t.cat==='Uncategorized'?'Uncategorized':groupOf(t.cat));
// Money-flow data for a Sankey diagram: Source -> Income -> Group -> Category -> Subcategory. Transfers are left out.
// Refunds reduce the category they belong to. If you spent more than you earned, a "Savings & other" source balances it.
function flowData(from,to){
  const rows=S.txns.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to)&&t.cat!=='Transfer');
  const src={},leaf={};  // leaf key: group|cat|sub
  for(const t of rows){
    if(isInc(t.cat)||(t.amount>0&&t.cat==='Investing')){const k=t.cat==='Interest'?'Interest':t.cat==='Income'?incomeSource(t):'Investment sales';src[k]=(src[k]||0)+t.amount;continue;}
    const k=groupLabel(t)+'\u0001'+t.cat+'\u0001'+(t.sub||'');
    leaf[k]=(leaf[k]||0)-t.amount;
  }
  const r2=n=>Math.round(n*100)/100;
  const L=[],nodes=new Map(),addN=(id,label,level)=>{if(!nodes.has(id))nodes.set(id,{id,label,level});};
  addN('inc','Income',1);
  let income=0;for(const k of Object.keys(src)){const v=r2(src[k]);if(v>0){income+=v;addN('src:'+k,k,0);L.push({source:'src:'+k,target:'inc',value:v});}}
  const catHasSub={};for(const k of Object.keys(leaf)){const [g,c,sb]=k.split('\u0001');if(sb) catHasSub[c]=true;}
  const gT={},cT={};let spent=0;
  for(const k of Object.keys(leaf)){
    const v=r2(leaf[k]);if(v<=0) continue;
    const [g,c,sb]=k.split('\u0001');spent+=v;gT[g]=(gT[g]||0)+v;cT[g+'\u0001'+c]=(cT[g+'\u0001'+c]||0)+v;
    if(catHasSub[c]){addN('sub:'+c+':'+(sb||''),sb||('Misc '+c),3);L.push({source:'cat:'+c,target:'sub:'+c+':'+(sb||''),value:v});}
  }
  if(spent>income+0.005){addN('src:__gap','Savings & other',0);L.push({source:'src:__gap',target:'inc',value:r2(spent-income)});income=spent;}
  for(const g of Object.keys(gT)){addN('grp:'+g,g,2);L.push({source:'inc',target:'grp:'+g,value:r2(gT[g])});}
  for(const k of Object.keys(cT)){const [g,c]=k.split('\u0001');addN('cat:'+c,c,catHasSub[c]?3:3,'');L.push({source:'grp:'+g,target:'cat:'+c,value:r2(cT[k])});}
  // subcategory nodes sit one level further right than their category
  for(const n of nodes.values()) if(n.id.startsWith('sub:')) n.level=4;
  if(income-spent>0.005){addN('sav','Left over',2);L.push({source:'inc',target:'sav',value:r2(income-spent)});}
  return {nodes:[...nodes.values()],links:L.filter(l=>l.value>0),totals:{income:r2(income),spent:r2(spent),left:r2(income-spent)}};
}

    const org=((a.org&&(a.org.name||a.org.domain))||conns[a.conn_id]||'').trim(),raw=String(a.name||'Account');
    const l4=(raw.match(/(\d{4})(?!.*\d)/)||[])[1]||'';

    const txns=(a.transactions||[]).filter(t=>!t.pending).map(t=>{

      const cl=v=>String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,140),py=cl(t.payee),mm=cl(t.memo),lc=o.desc.toLowerCase();

// Pending items are only shown, never counted: they live in S.pendingTx, outside the ledger, and are replaced on every sync.
function sfPending(j){
  const out=[];
  for(const a of (j.accounts||[])){
    const raw=String(a.name||'Account'),org=((a.org&&(a.org.name||a.org.domain))||'').trim();
    for(const t of (a.transactions||[])){
      if(!t.pending) continue;
      const amount=parseFloat(t.amount);
      if(!isFinite(amount)||Math.abs(amount)>=1e8) continue;
      out.push({sf:a.id,label:(org?org+' · ':'')+raw,date:sfDate(t.transacted_at||t.posted)||new Date().toISOString().slice(0,10),desc:String(t.description||'').replace(/\s+/g,' ').trim()||'(no description)',amount});
    }
  }
  return out.sort((x,y)=>y.date.localeCompare(x.date));
}
// A synced row can differ by a day or in wording from the same row in a statement; pair those one-to-one by amount and date.
function fuzzyPair(acct,rows,dupKeys,wantSf,only){
  const keys=new Set(dupKeys||[]),pool=S.txns.filter(t=>t.acct===acct&&!!t.sf===!!wantSf&&(!only||only(t))),used=new Set(pool.filter(t=>keys.has(t.key)).map(t=>t.id)),fresh=[],matched=[];let dup=0;
  for(const r of rows){
    // same amount within 3 days; when several rows qualify, the one whose description shares a word wins
    const rd=dayNum(r.date),rw=new Set(normMatch(r.desc||'').split(' ').filter(w=>w.length>=4));let best=null,bd=9;
    for(const t of pool){if(used.has(t.id)||Math.abs(t.amount-r.amount)>=0.005) continue;const dd=Math.abs(dayNum(t.date)-rd);if(dd>3) continue;
      const sc=dd+(normMatch(t.desc||'').split(' ').some(w=>rw.has(w))?0:0.5);if(sc<bd){best=t;bd=sc;}}
    if(best){used.add(best.id);dup++;matched.push(best);}else fresh.push(r);
  }
  return {fresh,dup,matched};
}

// Returns the saved file's id (reusing an identical file already stored), or null if the browser refused storage.
async function attachOriginal(m){
  const old=S.files.find(x=>x.hash===m.hash&&x.acct===m.acct);
  // same file imported again: keep the saved copy but take the fresh totals check, so a statement that reads correctly now stops being flagged
  if(old){if(m.reconcile){const sg=m.flip?-1:1;old.reconcile=m.reconcile;if(m.beginBal!=null)old.beginBal=sg*m.beginBal;if(m.endBal!=null)old.endBal=sg*m.endBal;}if(m.valBegin!=null)old.vb=m.valBegin;if(m.valEnd!=null)old.ve=m.valEnd;return {id:old.id,isNew:false};}
  const sib=S.files.find(x=>x.hash===m.hash),id=uid();
  let blob=id;
  if(sib) blob=sib.blob||sib.id;   // one PDF can hold several accounts (SoFi): store the bytes once
  else if(!(await blobPut(id,m.file))) return {id:null,isNew:false};
  const sg=m.flip?-1:1;
  S.files.push({id,blob,hash:m.hash,ref:m.ref||null,name:m.file.name.replace(/^[0-9a-f]{8}-/,''),size:m.file.size,kind:m.kind,acct:m.acct,start:m.start||null,end:m.end||null,
    beginBal:m.beginBal==null?null:sg*m.beginBal,endBal:m.endBal==null?null:sg*m.endBal,noLedger:!!m.noLedger,reconcile:m.reconcile||null,flip:!!m.flip,map:m.map||null,addedAt:Date.now(),...(m.valBegin!=null?{vb:m.valBegin}:{}),...(m.valEnd!=null?{ve:m.valEnd}:{})});
  return {id,isNew:true};
}

    dialog({msg:'New category name',input:true,placeholder:'e.g. Pets',ok:'Add',

function applyCat(id,cat){
  const t=S.txns.find(x=>x.id===id);if(!t)return;
  const oldCat=t.cat;t.cat=cat;save();
  const mk=merchantKey(t.desc);
  if(cat!=='Uncategorized'&&mk.length>=3){
    const similar=S.txns.filter(x=>x.id!==id&&x.cat!==cat&&(x.amount>0)===(t.amount>0)&&merchantKey(x.desc)===mk),prevCats=similar.map(x=>[x,x.cat]),prevRules=S.rules.slice();
    similar.forEach(x=>x.cat=cat);S.rules=S.rules.filter(r=>r.match!==mk);S.rules.unshift({match:mk,cat});save();
    toast('Saved: “'+mk+'” → '+cat+(similar.length?' · updated '+similar.length+' earlier':'')+' · applies to all new ones',{label:'Undo',fn:()=>{t.cat=oldCat;prevCats.forEach(([x,c])=>x.cat=c);S.rules=prevRules;save();render();toast('Undone');}});

}
